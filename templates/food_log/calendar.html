{% extends 'food_log/base.html' %}
{% load static %}

{% block content %}
  <h2>Food Calendar</h2>

  <div id="calendar"></div>

  <div class="modal fade" id="entryModal" tabindex="-1" aria-labelledby="entryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="entryModalLabel">Food Entry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p>Would you like to:</p>
          <button class="btn btn-primary" id="new-entry-btn">Create a New Entry</button>
          <button class="btn btn-secondary" id="view-log-btn">View Existing Entries</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="newEntryModal" tabindex="-1" aria-labelledby="newEntryModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newEntryModalLabel">Create New Food Entry</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            <form id="newEntryForm" action="{% url 'add_food_entry' %}" method="POST">
              {% csrf_token %}
              <input type="hidden" id="entryDate" name="date">
              <div class="mb-3">
                <label for="mealType" class="form-label">Meal Type:</label>
                <select id="mealType" name="meal_type" class="form-control" required>
                  <option value="breakfast">Breakfast</option>
                  <option value="lunch">Lunch</option>
                  <option value="dinner">Dinner</option>
                  <option value="snack">Snack</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="foodItem" class="form-label">Food Name:</label>
                <input type="text" id="foodItem" name="food_item" class="form-control">
              </div>
              <div class="mb-3">
                <label for="calories" class="form-label">Calories:</label>
                <input type="number" id="calories" name="calories" class="form-control">
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes:</label>
                <textarea id="notes" name="notes" class="form-control"></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Save Entry</button>
            </form>
          </form>
        </div>
      </div>
    </div>
  </div>

  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.0/main.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        dateClick: function(info) {
          const selectedDate = info.dateStr;
          $('#entryModal').modal('show');

          document.getElementById('entryDate').value = selectedDate;

          $('#new-entry-btn').off('click').on('click', function() {
            $('#entryModal').modal('hide');
            $('#newEntryModal').modal('show');
          });

          $('#view-log-btn').off('click').on('click', function() {
            window.location.href = '/food-log/view-entries/?date=' + selectedDate;
          });
        }
      });

      calendar.render();
    });
  </script>

{% endblock %}
